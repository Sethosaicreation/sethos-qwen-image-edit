name: Publish Vast Wan2.2 video worker

on:
  workflow_dispatch:
  push:
    branches: ["feature/vast-wan22-ti2v"]
    paths:
      - "Dockerfile.video"
      - "requirements-video.txt"
      - "wan_video_worker.py"
      - "schema.py"
      - "media.py"
      - "tests/test_wan_video_worker.py"
      - "tests/test_schema.py"
      - ".github/workflows/publish-vast-video.yml"

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test worker contracts
        run: |
          python -m pip install requests Pillow huggingface-hub fastapi==0.116.1 uvicorn==0.35.0 pydantic==2.11.7
          python -m unittest tests.test_wan_video_worker -v
          python -m py_compile schema.py media.py wan_video_worker.py
      - name: Free disk space for the CUDA image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo rm -rf /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          docker system prune --all --force --volumes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # The existing public repository is already writable by the scoped
          # Docker Hub PAT. Video remains a separate image through its tag and
          # immutable digest; no extra repository permission is required.
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sethos-ai-daily
          tags: |
            type=sha,prefix=video-sha-
            type=raw,value=video-latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.video
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
