name: Publish Vast Qwen worker

on:
  workflow_dispatch:
  push:
    branches: ["feature/vast-direct-worker"]
    tags: ["vast-v*"]

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test contracts
        run: |
          python -m pip install requests Pillow fastapi==0.116.1 uvicorn==0.35.0 pydantic==2.11.7
          python -m unittest discover -s tests -v
          python -m py_compile schema.py media.py inference.py handler.py vast_worker.py
      - name: Free disk space for the CUDA image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo rm -rf /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          docker system prune --all --force --volumes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sethos-ai-daily
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vast
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
